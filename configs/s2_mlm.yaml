# S2: span-MLM pretraining of the 33M statement encoder.
# corpus_cids / tokenizer_cid are filled from the quod manifest + frozen
# tokenizer before the first real run; the ledger refuses to compare metrics
# across a different (mathlib_pin, tokenizer_cid) pair.
mathlib_pin: "crouzeix:v4.28.0:8f9d9cff"
corpus_cids: []   # filled from corpora/MANIFEST.yml shard CIDs at run time
tokenizer_cid: "5b876e0b97924a7ed799e5453190a31a5ef09412956a07524ad023cfaa08e478"
tokenizer_path: runs/tokenizer/lean-unigram-32k.json
cache_dir: corpora/cache
cache_name: declarations-train
seed: 1337
batch_size: 48
steps: 60000
lr: 3.0e-4
compile: true
encoder:
  d_model: 512
  n_layers: 8
  n_heads: 8
  d_ff: 2048
  # pp.all canonical forms are long (p50=479 tokens; 47.5% exceed 512, 23.6%
  # exceed 1024). Until/unless a readable-pp corpus field lands, S2 runs at
  # 1024 to cut truncation to ~24%; batch dropped to 48 to fit the 4070.
  max_seq: 1024
