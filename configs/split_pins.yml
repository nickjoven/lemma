# Split-rule pins for runs that record no split_manifest_cid (every run sealed
# before lemma #10). lemma.data.split_binding refuses to evaluate such a run,
# or to train on top of it, unless its rule is pinned here or passed
# explicitly; it never falls back to today's rule.
#
# Evidence for each pin: the run's recorded code_git, and the blob of
# src/lemma/data/splits.py at that commit. Both blobs listed below have the
# same assign() (b0d106c only adds assign_transitions), which is
# splits.assign_v1 byte for byte. Limit: these records predate the dirty-tree
# check (L-10), so that the tree matched code_git is not verified; a pin is a
# statement about code history, not a sealed split. tests/test_split_binding.py
# re-checks the blobs when the commits are present.
#
# Owed (OPEN.yml L-9): the s2 cache's split-manifest.json on the GPU box, if it
# is still the one the checkpoint trained on, should be checked against the
# v1 reconstruction (evaluate_s2 --split-manifest) and its BLAKE3 recorded.
runs:
  s2-mlm-20260909-141736:
    # code_git is the TRAIN commit; build_cache ran at an unrecorded commit.
    # splits.py assign() is unchanged from c283a57 (module-level split) to
    # bfc9556; evaluate_s2 also requires the v1 rebuild to reproduce the
    # per-split counts of corpora/cache/cache-report.json.
    split_rule: v1-module-lock-follows-first
    code_git: a37d73e4b7487e63759230ec910b4e2cb58a83c1
    splits_py_blob: 524a2b447f383761d70f120dc673c05b662adb6e
