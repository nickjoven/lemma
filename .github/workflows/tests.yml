name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install (CPU torch; the lockfile pins CUDA wheels for the training box)
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python "torch==2.9.0" --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv/bin/python -e . pytest
      - name: Build ket (the ledger's evidence store; put/get need no Dolt)
        uses: actions/checkout@v4
        with:
          repository: nickjoven/ket
          ref: f16834a6257a7f50cfb5d1700fb4adcc78c0d36b
          path: ket-src
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ket-src
      - run: cargo build --release -p ket-cli --bin ket --manifest-path ket-src/Cargo.toml
      - name: Test
        run: PATH="$PWD/ket-src/target/release:$PATH" .venv/bin/python -m pytest -q
